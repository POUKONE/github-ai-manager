name: GitHub AI Manager - Daily Run

on:
  push:
    branches:
      - main
  schedule:
    # S'exécute tous les jours à 2h00 du matin UTC
    - cron: '0 2 * * *'

jobs:
  run-ai-manager:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupérer le code de ton projet GitHub AI Manager
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Installer Python 3.11
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Installer les dépendances du projet
    - name: Install Dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Exécuter l'Orchestrateur IA avec tes variables secrètes
    - name: Run GitHub AI Manager
      env:
        GITHUB_TOKEN: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        cd backend
        python main.py